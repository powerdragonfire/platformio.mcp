name: Release

# Push a tag like v0.3.0 (after the release PR is merged) to publish.
# Pushing the tag is the only manual step: tests, PyPI upload and the GitHub release follow.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch: # build and test only; publishing needs a tag

jobs:
  build:
    name: Verify, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12

      - name: Tag matches every version string and the changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release.py check --tag "$GITHUB_REF_NAME"

      - run: uv sync --group dev
      - run: uv run pytest -q
      - run: uv build
      - run: uvx --from dist/*.whl platformio.mcp --version
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/platformio.mcp/
    permissions:
      id-token: write # OIDC trusted publishing; no PyPI token stored in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py notes "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
