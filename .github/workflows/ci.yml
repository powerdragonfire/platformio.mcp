name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-consistency:
    name: versions and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fails when pyproject.toml, __init__.py, server.json, the plugin manifests and uv.lock
      # disagree, or when CHANGELOG.md lacks a section for the current version.
      - run: python3 scripts/release.py check

  changelog-entry:
    name: changelog updated
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: PR touches CHANGELOG.md
        run: |
          if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "::error file=CHANGELOG.md::Add a line under '## [Unreleased]', or apply the 'skip-changelog' label for changes users never see."
            exit 1
          fi

  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run pytest -q
      - run: uv build
      - run: uvx --from dist/*.whl platformio.mcp --version
        shell: bash

  integration:
    name: integration (native build with real PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --group dev --extra platformio
      - run: uv run pytest -m integration -q
